            background: #365d78;
            color: #fff;
            font: inherit;
            font-size: 14px;
            letter-spacing: .2em;
            cursor: pointer;
            transition: background .15s ease;
        }
        .gate button:hover { background: #2b4a61; }
        .gate.error input { border-color: #b03a4a; }
        .gate.error { animation: shake .32s ease; }
        @keyframes shake {
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
