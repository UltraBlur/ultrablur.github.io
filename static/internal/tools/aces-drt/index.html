            color: #fff;
            font: inherit;
            font-size: 14px;
            letter-spacing: .2em;
            cursor: pointer;
            transition: background .15s ease;
        }
        .gate button:hover { background: #2b4a61; }
        .gate.error input { border-color: #b03a4a; }
        .gate.error { animation: shake .32s ease; }
        @keyframes shake {
            25% { transform: translateX(-4px); }

            rememberPassphraseKey: "staticrypt_passphrase",
            replaceHtmlCallback: null,
            clearLocalStorageCallback: null,
        };

        const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

        window.onload = async function () {
            await staticrypt.handleDecryptOnLoad();
            document.getElementById("staticrypt-password").focus();
        };

        document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
            e.preventDefault();
            const form = e.currentTarget;
            const input = document.getElementById("staticrypt-password");
            const { isSuccessful } = await staticrypt.handleDecryptionOfPage(input.value, false);
            if (!isSuccessful) {
                form.classList.add("error");
                input.select();
                setTimeout(function () { form.classList.remove("error"); }, 500);
            }
        });
    </script>
</body>
</html>
