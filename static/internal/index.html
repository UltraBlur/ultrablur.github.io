<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <title></title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta http-equiv="cache-control" content="no-store">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fbfbfa;
            color: #1d1d1d;
            font-family: "didact gothic", "Hiragino Sans GB", "PingFang SC", sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .gate {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: min(78vw, 280px);
        }
        .gate input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1px solid #d9d9d2;
            border-radius: 2px;
            background: #fff;
            color: #1d1d1d;
            font: inherit;
            font-size: 15px;
            letter-spacing: .08em;
            outline: none;
            transition: border-color .15s ease;
        }
        .gate input:focus { border-color: #365d78; }
        .gate .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #5a5a52;
            cursor: pointer;
            user-select: none;
        }
        .gate .remember input {
            width: auto;
            height: auto;
            margin: 0;
            padding: 0;
            border: 0;
            background: transparent;
            accent-color: #365d78;
        }
        .gate .forget {
            text-align: center;
            font-size: 12px;
            color: #8a8a80;
            text-decoration: none;
        }
        .gate .forget:hover { color: #365d78; text-decoration: underline; }
        .gate button {
            width: 100%;
            height: 44px;
            border: 0;
            border-radius: 2px;
            background: #365d78;
            color: #fff;
            font: inherit;
            font-size: 14px;
            letter-spacing: .2em;
            cursor: pointer;
            transition: background .15s ease;
        }
        .gate button:hover { background: #2b4a61; }
        .gate.error input { border-color: #b03a4a; }
        .gate.error { animation: shake .32s ease; }
        @keyframes shake {
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
    </style>
</head>

            rememberPassphraseKey: "staticrypt_passphrase",
            replaceHtmlCallback: null,
            clearLocalStorageCallback: null,
        };

        const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

        /* 记住我：勾选项默认不勾；有效期来自构建参数（--remember）。 */
        const rememberRow = document.getElementById("staticrypt-remember-row");
        const rememberBox = document.getElementById("staticrypt-remember");
        const forgetLink = document.getElementById("staticrypt-forget");
        if (!staticryptConfig.isRememberEnabled) {
            rememberRow.hidden = true;
            forgetLink.hidden = true;
        } else {
            const days = Number(staticryptConfig.rememberDurationInDays) || 0;
            document.getElementById("staticrypt-remember-label").textContent =
                days > 0 ? "记住此设备（" + days + " 天）" : "记住此设备";
        }

        forgetLink.addEventListener("click", function (e) {
            e.preventDefault();
            try {
                localStorage.removeItem(templateConfig.rememberExpirationKey);
                localStorage.removeItem(templateConfig.rememberPassphraseKey);
            } catch (err) { /* 隐私模式等场景忽略 */ }
            forgetLink.textContent = "已清除本机记住";
        });

        window.onload = async function () {
            await staticrypt.handleDecryptOnLoad();
            document.getElementById("staticrypt-password").focus();
        };

        document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
            e.preventDefault();
            const form = e.currentTarget;
            const input = document.getElementById("staticrypt-password");
            const remember = staticryptConfig.isRememberEnabled && rememberBox.checked;
            const { isSuccessful } = await staticrypt.handleDecryptionOfPage(input.value, remember);
            if (!isSuccessful) {
                form.classList.add("error");
                input.select();
                setTimeout(function () { form.classList.remove("error"); }, 500);
            }
        });
    </script>
</body>
</html>
