baseURL = 'https://ultrablur.github.io/'
locale = 'en-US'
title = '高胡宇晨｜Gao Huyuchen'
theme = 'sam'  
enableEmoji = true

pygmentsStyle            = "monokai"                        #   
pygmentsCodefences       = true

[params.videoBackground]
    poster  = "/WebBG_poster.jpg" # 视频未播放/不播放时显示的静帧
    overlay = "rgba(0, 0, 0, 0)"  # optional

[[params.videoBackground.sources]]
    source  = "/WebBG_V07.mp4" # 1080p H.264；源文件可从 git 历史取回
    type    = "video/mp4"


[params]
    homepage             = "main"                           # What to call the home page link, link will not be rendered if empty
    footerText           = ""

# 首页入口：目前只公开 colour 与 tools。其余页面内容未就绪，先不接入导航
# （页面仍然构建、可直链访问，只是不出现在首页大链接和页脚菜单里）；恢复时取消注释即可。

[[params.mainMenu]]
    link = "/colour/"
    text = "colour"

[[params.mainMenu]]
    link = "/tools/"
    text = "tools"

# [[params.mainMenu]]
#     link = "/posts/"
#     text = "posts"
#
# [[params.mainMenu]]
#     link = "/gallery/"
#     text = "gallery"
#
# [[params.mainMenu]]
#     link = "/archive"
#     text = "archive"
#
# [[params.mainMenu]]
#     link = "/about"
#     text = "Gao Huyuchen"

[markup.goldmark.renderer]
  # 页面正文里用了少量原生 HTML（<strong>、<details>）；默认 unsafe=false 会把它们静默丢掉
  unsafe = true

[markup.highlight]
  noClasses = true
  style = "friendly"

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2
  ordered = false
