baseURL = 'https://ultrablur.github.io/'
locale = 'en-US'
title = '高胡宇晨｜Gao Huyuchen'
theme = 'sam'  
enableEmoji = true

pygmentsStyle            = "monokai"                        #   
pygmentsCodefences       = true

[[params.videoBackground.sources]]
    source  = "/WebBG_V06.mp4" # Your video file
    type    = "video/mp4"
    poster  = "/WebBG.jpg" # The image to show when the video isn't playing

[params.videoBackground]
    overlay = "rgba(0, 0, 0, 0)" # optional


[params]
    homepage             = "main"                           # What to call the home page link, link will not be rendered if empty
    footerText           = ""

[[params.mainMenu]]
    link = "/posts/"
    text = "posts"

[[params.mainMenu]]
    link = "/gallery/"
    text = "gallery"

[[params.mainMenu]]
    link = "/colour/"
    text = "colour"

[[params.mainMenu]]
    link = "/tools/"
    text = "tools"

[[params.mainMenu]]
    link = "/archive"
    text = "archive"

[[params.mainMenu]]
    link = "/about"
    text = "Gao Huyuchen"

[markup.goldmark.renderer]
  # 页面正文里用了少量原生 HTML（<strong>、<details>）；默认 unsafe=false 会把它们静默丢掉
  unsafe = true

[markup.highlight]
  noClasses = true
  style = "friendly"

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2
  ordered = false
