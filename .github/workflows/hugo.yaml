
name: Build and deploy site

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash
  
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 校验发布签名
        env:
          PUBLISH_HMAC_KEY: ${{ secrets.PUBLISH_HMAC_KEY }}
        run: |
          set -euo pipefail
          tag=$(git tag --points-at HEAD | grep -E '^sec-verified-' | head -1 || true)
          if [ -z "$tag" ]; then
            echo "::error::HEAD 没有审计发布 tag：main 只能由管理员带签名发布，拒绝部署"
            exit 1
          fi
          msg=$(git tag -l --format='%(contents)' "$tag")
          got=$(printf '%s\n' "$msg" | sed -n 's/^hmac: //p' | head -1)
          want=$(printf '%s' "$GITHUB_SHA" | openssl dgst -sha256 -hmac "$PUBLISH_HMAC_KEY" -hex | awk '{print $NF}')
          if [ -z "$got" ] || [ "$got" != "$want" ]; then
            echo "::error::发布 tag 签名无效，拒绝部署"
            exit 1
          fi

  build:
    needs: verify
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.162.1
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Node 依赖
        run: npm ci

      - name: 公开测试
        run: npm test
      
      - name: 安装Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb      
      
      - name: 安装 Dart Sass
        run: sudo npm install -g sass@1.77.8 && sass --version

      - name: 设置Pages
        id: pages
        uses: actions/configure-pages@v5
        
      - name: 使用Hugo构建
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"          
      - name: 公开边界检查
        run: bash scripts/verify/public-boundary.sh

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
