  enNote: Spectral-sharpening matrix fitted to visual corresponding-colour data; its effective responses are not measured camera or cone curves
  zhUse: 对应色预测 · 光谱锐化
  enUse: Corresponding-colour prediction · spectral sharpening
  status: done

