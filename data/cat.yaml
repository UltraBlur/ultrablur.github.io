  enNote: Sharpened cone space from Lam's 1985 thesis; ICC recommends its linearised form for PCS adaptation
  zhUse: ICC PCS 推荐白点适应
  enUse: Recommended ICC PCS adaptation
  status: done

- slug: sharp
  zh: Sharp
  en: Sharp
