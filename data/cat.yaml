# 色适应变换清单
#
# /cat/ 索引页与侧栏「色适应变换」都读这份数据；加条目只改这里。
# 页面按 /cat/<slug>/ 挂：写好后把 status 改成 wip / done，链接自动出现。
# 顺序即索引表与侧栏的顺序（按年份，XYZ Scaling 作为基准反例排在最前）。
- slug: xyz-scaling
  zh: XYZ Scaling
  en: XYZ Scaling
  year: "—"
  zhNote: 基准反例：直接在 XYZ 上按白点比值缩放，不做锥体转换
  enNote: "Baseline counterexample: scale XYZ directly by the white-point ratios, with no cone transform"
  zhUse: 对照基准 · 说明锥体空间为什么必要
  enUse: Baseline · why a cone space is needed
  status: done

- slug: von-kries
  zh: von Kries
  en: von Kries
  year: 1902
  zhNote: 系数律本身：锥体响应逐通道缩放。这里用 HPE 锥体空间
  enNote: The coefficient law itself — per-channel scaling of cone responses, here in Hunt–Pointer–Estevez space
  zhUse: CIE 109-1994 的锥体空间
  enUse: Cone space of CIE 109-1994
  status: done

- slug: bradford
  zh: Bradford
  en: Bradford
  year: 1985
